resources:
  # A first-class SQL warehouse resource so the dashboard references it by
  # ${resources...id} instead of a hardcoded, hand-copied warehouse id.
  sql_warehouses:
    metrics_warehouse:
      name: "streaming-monitor-warehouse"
      cluster_size: "2X-Small"
      warehouse_type: PRO
      enable_serverless_compute: true
      auto_stop_mins: 10
      max_num_clusters: 1

  dashboards:
    streaming_health_dashboard:
      display_name: "Streaming Query Health (Zerobus)"
      file_path: ../dashboard/streaming_health.lvdash.json
      warehouse_id: ${resources.sql_warehouses.metrics_warehouse.id}
      # Redeploy when the local dashboard file changes.
      embed_credentials: false
