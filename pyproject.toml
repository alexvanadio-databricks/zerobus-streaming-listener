[project]
name = "streaming-query-listener-zerobus"
version = "0.1.0"
description = "Reusable pattern for capturing Spark streaming query metrics via Databricks Zerobus into a Delta table"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "databricks-zerobus-ingest-sdk>=0.1.0",
]

[project.optional-dependencies]
# Installed on the cluster / locally when generating example data.
# pyspark is provided by the Databricks runtime, so it is only needed locally.
example = [
    "dbldatagen>=0.4.0",
    "pyspark>=3.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "basedpyright>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming_listener"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "example"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "example"]
# pyspark, dbldatagen and the zerobus SDK are provided by the Databricks
# runtime / installed on the cluster, not in the local lint env. Don't fail on
# their absence or missing stubs.
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportMissingImports = false
